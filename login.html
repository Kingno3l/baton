<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baton Login</title>

  <!-- Bootstrap & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Amiko:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />

  <!-- Custom CSS -->
  <link href="assets/css/style.css" rel="stylesheet" />
</head>

<body>
  <div class="container-fluid h-100">
    <div class="row h-100">

      <!-- Left Panel -->
      <div class="col-md-6 left-panel d-flex flex-column justify-content-between h-100 p-0">

        <!-- TOP SECTION -->
        <div class="text-center p-4">
          <h2 class="button-big m-0">LOGIN</h2>
        </div>

        <!-- MIDDLE SECTION -->
        <div class="form-wrapper">
          <form>
            <input type="email" class="form-control mb-3 custom-input" placeholder="Email" />

            <div class="password-wrapper mb-2">
              <input type="password" class="form-control custom-input" id="password" placeholder="Password" />
              <i class="fa fa-eye toggle-password" onclick="toggleVisibility('password', this)"></i>
            </div>

           <div class="d-flex justify-content-between align-items-center mb-4 px-2" style="font-family: 'Amiko', sans-serif;">
  <div class="form-check">
    <input class="form-check-input checkbox-shadow" type="checkbox" id="keepLoggedIn">
    <label class="form-check-label batonText" for="keepLoggedIn">Keep me logged in</label>
  </div>
  <div>
    <a href="forgot-password.html" class="text-decoration-none text-black fw-semibold">Forgot Password?</a>
  </div>
</div>


            <button type="submit" class="btn baton text-white mb-3" style="
              font-family: 'Montserrat', sans-serif;
              width: 539px;
              height: 80px;
              border-radius: 48.56px;
              border-width: 1.62px;
              font-weight: bold;">
              Login
            </button>
          </form>

          <p class="text-center text-black fw-semibold mb-4" style="font-family: 'Amiko', sans-serif;">
            Or login with
          </p>

          <div class="social-icons d-flex justify-content-center mb-4">
            <img src="assets/images/icons/google.png" alt="Google"
              style="width: 40px; height: 40px; margin: 0 10px; cursor: pointer;">
            <img src="assets/images/icons/facebook.png" alt="Facebook"
              style="width: 40px; height: 40px; margin: 0 10px; cursor: pointer;">
          </div>
        </div>

        <!-- BOTTOM SECTION -->
        <div class="text-center p-4">
          <small style="
            font-family: 'Amiko', sans-serif;
            font-weight: 600;
            font-size: 25.9px;
            line-height: 100%;
            text-align: center;
            color: #000000;">
            Don't have an account?
            <a href="signup.html" class="fw-bold text-decoration-none batonText">Sign up</a>
          </small>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="col-md-6 right-panel position-relative">
        <!-- Slide Backgrounds -->
        <div id="slide1-background" class="slide-bg slide1-bg"></div>
        <div id="slide2-background" class="slide-bg slide2-bg"></div>
        <div id="slide3-background" class="slide-bg slide3-bg"></div>
        <div id="slide4-background" class="slide-bg slide4-bg"></div>

        <!-- Foreground Content -->
        <div class="text-center position-relative" style="z-index: 2;">
          <img src="assets/images/logo/BATON.png" alt="Baton Logo" class="mb-3" style="max-width: 200px;" />
          <p class="text-light">The ultimate search engine for reliable service providers</p>

          <div id="customCarousel" class="carousel slide carousel-fade flex-grow-1" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-inner carousel-content">
              <div class="carousel-item active">
                <h1 class="hero-text">Search for reliable service providers</h1>
              </div>
              <div class="carousel-item">
                <h1 class="hero-text">Find trusted experts instantly</h1>
              </div>
              <div class="carousel-item">
                <h1 class="hero-text">Book verified services with ease</h1>
              </div>
              <div class="carousel-item">
                <h1 class="hero-text">Your trusted Baton companion</h1>
              </div>
            </div>
          </div>

          <div class="slider-indicators">
            <div class="custom-indicator active"></div>
            <div class="custom-indicator inactive"></div>
            <div class="custom-indicator inactive"></div>
            <div class="custom-indicator inactive"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
