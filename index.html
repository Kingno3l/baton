<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baton Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Amiko:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />


  <style>
    body,
    html {
      height: 100%;
      margin: 0;
      font-family: 'Montserrat', sans-serif;
    }

    .left-panel {
      background: url('assets/images/baton background 1.png');
      background-size: cover;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100vh;
      color: white;
    }

    .form-wrapper {
      max-width: 539px;
      margin: 0 auto;
    }

    .custom-input {
      width: 539px;
      height: 64.74px;
      border-radius: 80.93px;
      border: 1.62px solid #ccc;
      background-color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 1rem 1.5rem;
      font-size: 1rem;
    }

    .custom-input::placeholder {
      font-family: 'Amiko', sans-serif;
      font-weight: 600;
      font-size: 19.42px;
      line-height: 100%;
      letter-spacing: 0;
      color: #666666;
    }

    .btn-signup {
      border-radius: 2rem;
      padding: 12px;
      font-weight: bold;
    }

    .social-icons i {
      font-size: 24px;
      margin: 0 10px;
      cursor: pointer;
    }

   

    .right-panel {
      color: white;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      transition: background-color 0.5s ease-in-out;
    }


    .hero-text {
      font-weight: 900;
      font-size: 70px;
      line-height: 100%;
      text-transform: uppercase;
      text-align: left;
      padding-top: 5rem;
    }

    .slider-indicators {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 2rem;
      margin-bottom: 20px;
    }

    .slider-indicators .active {
      width: 30px;
      height: 6px;
      background: #B40C0F;
      border-radius: 3px;
    }

    .slider-indicators .inactive {
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
    }


    .custom-indicator {
      cursor: pointer;
    }

    .carousel-content {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      padding: 0 40px;
    }

    .baton {
      background-color: #B40C0F;
      border: none;
      transition: background-color 0.3s ease;
    }

    .baton:hover {
      background-color: #990b0d;
      /* darker red for hover */
      color: white;
    }

    .batonText {
      color: #B40C0F;
    }

    .button-big {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 38.85px;
      line-height: 100%;
      letter-spacing: 0;
      color: #000000;
      text-align: center;
      text-transform: uppercase;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #999;
    }

    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }

    input[type="password"]::-webkit-contacts-auto-fill-button,
    input[type="password"]::-webkit-credentials-auto-fill-button {
      visibility: hidden;
      display: none !important;
      pointer-events: none;
      height: 0;
      width: 0;
      margin: 0;
    }

    .slide-bg {
  position: absolute;
  width: 357px;
  height: 342px;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: bottom right;
  opacity: 0.4;
  z-index: 1;
  pointer-events: none;
  display: none;
}


.slide1-bg {
  background-image: url('assets/images/bg-image/slide1-image.png');
  right: 0;
  bottom: 0;
}

.slide2-bg {
  background-image: url('assets/images/bg-image/slide2-image.png');
  left: 0;
  bottom: 0;
}

.slide3-bg {
  background-image: url('assets/images/bg-image/slide3-image.png');
  left: 0;
  bottom: 0;
}

.slide4-bg {
  background-image: url('assets/images/bg-image/slide4-image.png');
  right: 0;
  bottom: 0;
}

  </style>
</head>

<body>
  <div class="container-fluid h-100">
    <div class="row h-100">
      <!-- Left Panel -->




      <div class="col-md-6 left-panel d-flex flex-column justify-content-between h-100 p-0">

        <!-- TOP SECTION -->
        <div class="text-center  p-4">
          <h2 class="button-big m-0">SIGN UP</h2>
        </div>

        <!-- MIDDLE SECTION -->
        <div class="form-wrapper">
          <form>
            <input type="email" class="form-control mb-3 custom-input" placeholder="Email">

            <div class="password-wrapper mb-3">
              <input type="password" class="form-control custom-input" id="password" placeholder="Create Password">
              <i class="fa fa-eye toggle-password" onclick="toggleVisibility('password', this)"></i>
            </div>

            <div class="password-wrapper mb-4">
              <input type="password" class="form-control custom-input" id="confirmPassword"
                placeholder="Confirm Password">
              <i class="fa fa-eye toggle-password" onclick="toggleVisibility('confirmPassword', this)"></i>
            </div>

            <button type="submit" class="btn baton text-white mb-3" style="
        font-family: 'Montserrat', sans-serif;
        width: 539px;
        height: 80px;
        border-radius: 48.56px;
        border-width: 1.62px;
        font-weight: bold;">
              Sign Up
            </button>
          </form>

          <p class="text-center text-black fw-semibold mb-2" style="font-family: 'Amiko', sans-serif;">Or sign up with
          </p>

          <div class="social-icons d-flex justify-content-center mb-4">
            <img src="assets/images/icons/google.png" alt="Google"
              style="width: 40px; height: 40px; margin: 0 10px; cursor: pointer;">
            <img src="assets/images/icons/facebook.png" alt="Facebook"
              style="width: 40px; height: 40px; margin: 0 10px; cursor: pointer;">
          </div>
        </div>

        <!-- BOTTOM SECTION -->
        <div class="text-center p-4">
          <small style="
      font-family: 'Amiko', sans-serif;
      font-weight: 600;
      font-size: 25.9px;
      line-height: 100%;
      letter-spacing: 0;
      text-align: center;
      color: #000000;">
            Already have an account?
            <a href="#" class="fw-bold text-decoration-none batonText">Login</a>
          </small>
        </div>

      </div>




      <!-- Right Panel -->
      <div class="col-md-6 right-panel position-relative">
        <!-- Backgrounds for each slide -->
        <div id="slide1-background" class="slide-bg slide1-bg"></div>
        <div id="slide2-background" class="slide-bg slide2-bg"></div>
        <div id="slide3-background" class="slide-bg slide3-bg"></div>
        <div id="slide4-background" class="slide-bg slide4-bg"></div>

        <!-- Foreground content -->
        <!-- Foreground content -->
<div class="text-center position-relative" style="z-index: 2;">
  <img src="assets/images/logo/BATON.png" alt="Baton Logo" class="mb-3" style="max-width: 200px;" />
  <p class="text-light">The ultimate search engine for reliable service providers</p>

  <div id="customCarousel" class="carousel slide carousel-fade flex-grow-1" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner carousel-content">
      <div class="carousel-item active">
        <h1 class="hero-text">Search for reliable service providers</h1>
      </div>
      <div class="carousel-item">
        <h1 class="hero-text">Find trusted experts instantly</h1>
      </div>
      <div class="carousel-item">
        <h1 class="hero-text">Book verified services with ease</h1>
      </div>
      <div class="carousel-item">
        <h1 class="hero-text">Your trusted Baton companion</h1>
      </div>
    </div>
  </div>

  <div class="slider-indicators">
    <div class="custom-indicator active"></div>
    <div class="custom-indicator inactive"></div>
    <div class="custom-indicator inactive"></div>
    <div class="custom-indicator inactive"></div>
  </div>
</div>



      </div>
    </div>

    <!-- Bootstrap JS + Indicator Sync Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <script>
      function toggleVisibility(id, icon) {
        const input = document.getElementById(id);
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }
    </script>

    <script>
      const carousel = document.getElementById('customCarousel');
      const indicators = document.querySelectorAll('.custom-indicator');
      const rightPanel = document.querySelector('.right-panel');

      const bgColors = ['#171219', '#700002', '#311B15', '#666666'];

      const slide1Background = document.getElementById('slide1-background');
      const slide2Background = document.getElementById('slide2-background');
      const slide3Background = document.getElementById('slide3-background');
      const slide4Background = document.getElementById('slide4-background');

      const updateIndicators = (activeIndex) => {
        indicators.forEach((dot, index) => {
          dot.classList.toggle('active', index === activeIndex);
          dot.classList.toggle('inactive', index !== activeIndex);
        });

        // Set background color of the right panel
        rightPanel.style.backgroundColor = bgColors[activeIndex];

        // Hide all backgrounds first
        [slide1Background, slide2Background, slide3Background, slide4Background].forEach(bg => {
          bg.style.display = 'none';
        });

        // Show the current one
        if (activeIndex === 0) slide1Background.style.display = 'block';
        if (activeIndex === 1) slide2Background.style.display = 'block';
        if (activeIndex === 2) slide3Background.style.display = 'block';
        if (activeIndex === 3) slide4Background.style.display = 'block';
      };

      carousel.addEventListener('slid.bs.carousel', (e) => {
        updateIndicators(e.to);
      });

      indicators.forEach((dot, index) => {
        dot.addEventListener('click', () => {
          const carouselInstance = bootstrap.Carousel.getInstance(carousel);
          carouselInstance.to(index);
        });
      });

      // Initial background setup
      updateIndicators(0);
    </script>




</body>

</html>
