<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baton Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fff;
        }

        .icon-btn {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .vr {
            width: 1px;
            background-color: #ccc;
        }

        .nav-link.active {
            background-color: transparent !important;
            color: inherit !important;
            font-weight: 600;
            border-bottom: 2px solid #B40C0F;
        }

        .nav-link {
            color: #333;
            margin: 0 10px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <!-- Top Bar -->
        <div class="top-bar d-flex justify-content-between align-items-center px-3 py-2">
            <!-- Logo -->
            <div class="d-flex align-items-center" style="min-width: 150px;">
                <img src="assets/images/logo/baton-search.png" alt="Baton Logo" style="height: 40px;" />
            </div>

            <!-- Search Bar -->
            <div class="search-bar d-flex align-items-center flex-grow-1 mx-3 bg-white px-3 rounded-pill shadow position-relative"
                style="max-width: 700px; height: 84px;">
                <img src="https://cdn-icons-png.flaticon.com/512/49/49116.png" alt="Search" class="me-2 opacity-50"
                    style="width: 24px; height: 24px;" />

                <div class="flex-grow-1 position-relative">
                    <input type="text" class="form-control border-0 shadow-none pe-4"
                        placeholder="Search Service Providers" id="searchInput" />
                    <span id="clearSearch"
                        style="cursor: pointer; position: absolute; top: 50%; right: 8px; transform: translateY(-50%); font-size: 30px; display: none;">&times;</span>
                </div>

                <div style="width: 1px; height: 60%; background-color: #ccc; margin: 0 1rem;"></div>

                <img src="assets/images/search/search-1.png" class="icon-btn" alt="Handshake"
                    style="width: 63.53px; height: 56.06px; margin-left: 10px;" />
                <img src="assets/images/search/search-2.png" class="icon-btn" alt="Megaphone"
                    style="width: 63.53px; height: 56.06px; margin-left: 10px;" />
                <img src="assets/images/search/search-3.png" class="icon-btn" alt="Settings"
                    style="width: 63.53px; height: 56.06px; margin-left: 10px;" />
            </div>

            <!-- User Avatar -->
            <div class="d-flex align-items-center" style="min-width: 50px;">
                <div class="rounded-circle bg-warning text-white fw-bold d-flex justify-content-center align-items-center"
                    style="width: 60px; height: 60px;">
                    FA
                </div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="d-flex justify-content-center mt-2 pt-5 mb-0">
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a class="nav-link active" href="#">All</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Near me</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Highest Referrals</a>
                </li>
            </ul>
        </div>

        <hr style="border: 0; border-top: 3px solid #ccc;" />

        <!-- Providers Grid -->
        <div class="container py-1 pt-5">
            <div class="row row-cols-1 row-cols-md-2 g-2" id="providerGrid">
                <!-- JS will populate providers + custom card here -->
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById("searchInput");
        const clearBtn = document.getElementById("clearSearch");
        const providerGrid = document.getElementById("providerGrid");

        input.addEventListener("input", () => {
            clearBtn.style.display = input.value ? "block" : "none";
        });

        clearBtn.addEventListener("click", () => {
            input.value = "";
            clearBtn.style.display = "none";
            input.focus();
        });

        const serviceProviders = {
            all: [
                { name: "FATAI", phone: "08011111111", location: "Area 1, Abuja", referrals: 2, reports: 0 },
                { name: "DANIEL", phone: "08011111111", location: "Lugbe, Abuja", referrals: 4, reports: 2 },
                { name: "MARY", phone: "08011111111", location: "Area 8, Abuja", referrals: 3, reports: 1 },
                { name: "DELE", phone: "08011111111", location: "Area 1, Abuja", referrals: 3, reports: 0 },
            ],
            nearMe: [
                { name: "DANIEL", phone: "08011111111", location: "Lugbe, Abuja", referrals: 4, reports: 2 },
                { name: "MARY", phone: "08011111111", location: "Area 8, Abuja", referrals: 3, reports: 1 },
            ],
            highestReferrals: [
                { name: "DANIEL", phone: "08011111111", location: "Lugbe, Abuja", referrals: 4, reports: 2 },
                { name: "MARY", phone: "08011111111", location: "Area 8, Abuja", referrals: 3, reports: 1 },
                { name: "DELE", phone: "08011111111", location: "Area 1, Abuja", referrals: 3, reports: 0 },
            ]
        };

        function renderProviders(data) {
            providerGrid.innerHTML = ""; // Clear existing
            data.slice(0, 4).forEach(({ name, phone, location, referrals, reports }) => {
                providerGrid.innerHTML += `
          <div class="col pt-2">
            <div class="p-3 rounded shadow-sm bg-white h-100">
              <h6 class="fw-bold mb-1">${name}
                <img src="assets/images/icons/referral.png" width="43" height="37" />
                ${reports > 0 ? `<img src="assets/images/icons/report.png" width="43" height="37" />` : ""}
              </h6>
              <p class="mb-1 small text-muted">AC Technician ${phone}</p>
              <p class="mb-1 small text-muted">Nigeria, ${location}</p>
              <p class="mb-0 small text-danger fw-semibold">
                ${referrals} REFERRALS ${reports > 0 ? `<span class="text-danger">${reports} REPORT${reports > 1 ? "S" : ""}</span>` : ""}
              </p>
            </div>
          </div>
        `;
            });

            // Add the custom card
         
        }

        renderProviders(serviceProviders.all);

        document.querySelectorAll(".nav-link").forEach(tab => {
            tab.addEventListener("click", e => {
                e.preventDefault();
                document.querySelectorAll(".nav-link").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");

                const text = tab.textContent.trim().toLowerCase();
                if (text === "all") renderProviders(serviceProviders.all);
                else if (text === "near me") renderProviders(serviceProviders.nearMe);
                else if (text === "highest referrals") renderProviders(serviceProviders.highestReferrals);
            });
        });
    </script>
</body>

</html>
