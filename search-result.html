<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baton Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        .icon-btn {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .nav-link.active {
            background-color: transparent !important;
            color: inherit !important;
            font-weight: 600;
            border-bottom: 2px solid #B40C0F;
        }

        .nav-link {
            color: #333;
            margin: 0 10px;
        }

        .provider-card {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <!-- Top Bar -->
        <div class="top-bar d-flex justify-content-between align-items-center px-3 py-2">
            <div style="min-width: 150px;">
                <img src="assets/images/logo/baton-search.png" alt="Baton Logo" style="height: 40px;" />
            </div>

            <!-- Search -->
            <div class="search-bar d-flex align-items-center flex-grow-1 mx-3 bg-white px-3 rounded-pill shadow position-relative"
                style="max-width: 700px; height: 84px;">
                <img src="https://cdn-icons-png.flaticon.com/512/49/49116.png" alt="Search" class="me-2 opacity-50"
                    style="width: 24px; height: 24px;" />
                <div class="flex-grow-1 position-relative">
                    <input type="text" class="form-control border-0 shadow-none pe-4"
                        placeholder="Search Service Providers" id="searchInput" />
                    <span id="clearSearch"
                        style="cursor: pointer; position: absolute; top: 50%; right: 8px; transform: translateY(-50%); font-size: 30px; display: none;">&times;</span>
                </div>
                <div style="width: 1px; height: 60%; background-color: #ccc; margin: 0 1rem;"></div>
                <img src="assets/images/search/search-1.png" class="icon-btn" alt="Handshake"
                    style="width: 63px; height: 56px; margin-left: 10px;" />
                <img src="assets/images/search/search-2.png" class="icon-btn" alt="Megaphone"
                    style="width: 63px; height: 56px; margin-left: 10px;" />
                <img src="assets/images/search/search-3.png" class="icon-btn" alt="Settings"
                    style="width: 63px; height: 56px; margin-left: 10px;" />
            </div>

            <div style="min-width: 50px;">
                <div class="rounded-circle bg-warning text-white fw-bold d-flex justify-content-center align-items-center"
                    style="width: 60px; height: 60px;">
                    FA
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="d-flex justify-content-center mt-2 pt-5 mb-0">
            <ul class="nav nav-pills">
                <li class="nav-item"><a class="nav-link active" href="#">All</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Near me</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Highest Referrals</a></li>
            </ul>
        </div>

        <hr style="border: 0; border-top: 3px solid #ccc;" />

        <!-- Providers -->
        <div class="container py-1 pt-5">
            <div class="row row-cols-1 row-cols-md-3 g-2" id="providerGrid"></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="providerModal" tabindex="-1" aria-labelledby="providerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow-lg border-0">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title" id="providerModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center px-4 pb-4 pt-0">
                    <img src="assets/images/icons/referral.png" alt="Profile" class=" p-2 mb-3"
                        style="width: 150px; " />
                    <h4 class="fw-bold" id="modalName">Provider Name</h4>
                    <p class="text-danger fw-semibold mb-1" id="modalReferrals">0 REFERRALS</p>
                    <p class="text-muted mb-1" id="modalPhone">Phone</p>
                    <p class="text-muted" id="modalLocation">Location</p>

                    <h6 class="fw-bold mt-4">TAKE ACTION</h6>
                <div class="d-flex justify-content-center gap-3 my-3">
                    <div class="d-flex align-items-center justify-content-center" style="width: 52px; height: 52px;">
                        <img src="assets/images/icons/phone.png" alt="Phone" style="width: 51.62px;" />
                    </div>
                    <div class="d-flex align-items-center justify-content-center" style="width: 52px; height: 52px;">
                        <img src="assets/images/icons/email.png" alt="Email" style="width: 51.62px;" />
                    </div>
                    <div class="d-flex align-items-center justify-content-center" style="width: 52px; height: 52px;">
                        <img src="assets/images/icons/whatsapp.png" alt="Profile" style="width: 51.62px;" />
                    </div>
                    <div class="d-flex align-items-center justify-content-center" style="width: 52px; height: 52px;">
                        <img src="assets/images/icons/referral-icon.png" alt="Handshake" style="width: 51.62px;" />
                    </div>
                    <div class="d-flex align-items-center justify-content-center" style="width: 52px; height: 52px;">
                        <img src="assets/images/icons/report-icon.png" alt="Delivery" style="width: 51.62px;" />
                    </div>
                </div>



                    <h6 class="text-danger mb-2">Reviews</h6>
                    <p class="small mb-1"><strong>marsxxxxy@gmail.com</strong><br />Highly experienced in fixing AC</p>
                    <p class="small"><strong>marsxxxxy@gmail.com</strong><br />Highly experienced in fixing AC</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const searchInput = document.getElementById("searchInput");
        const clearBtn = document.getElementById("clearSearch");

        const providerGrid = document.getElementById("providerGrid");

        const serviceProviders = {
            all: [
                { name: "FATAI", phone: "08011111111", location: "Area 1, Abuja", referrals: 2, reports: 0 },
                { name: "DANIEL", phone: "08011111111", location: "Lugbe, Abuja", referrals: 4, reports: 2 },
                { name: "MARY", phone: "08011111111", location: "Area 8, Abuja", referrals: 3, reports: 1 },
                { name: "DELE", phone: "08011111111", location: "Area 1, Abuja", referrals: 3, reports: 0 },
            ],
            nearMe: [
                { name: "DANIEL", phone: "08011111111", location: "Lugbe, Abuja", referrals: 4, reports: 2 },
                { name: "MARY", phone: "08011111111", location: "Area 8, Abuja", referrals: 3, reports: 1 },
            ],
            highestReferrals: [
                { name: "DANIEL", phone: "08011111111", location: "Lugbe, Abuja", referrals: 4, reports: 2 },
                { name: "MARY", phone: "08011111111", location: "Area 8, Abuja", referrals: 3, reports: 1 },
                { name: "DELE", phone: "08011111111", location: "Area 1, Abuja", referrals: 3, reports: 0 },
            ]
        };

        function renderProviders(list) {
            providerGrid.innerHTML = "";
            list.forEach(({ name, phone, location, referrals, reports }) => {
                const col = document.createElement("div");
                col.className = "col pt-2";
                col.innerHTML = `
          <div class="p-3 rounded shadow-sm bg-white h-100 provider-card">
            <h6 class="fw-bold mb-1">${name}
              <img src="assets/images/icons/referral.png" width="43" height="37" />
              ${reports > 0 ? `<img src="assets/images/icons/report.png" width="43" height="37" />` : ""}
            </h6>
            <p class="mb-1 small text-muted">AC Technician ${phone}</p>
            <p class="mb-1 small text-muted">Nigeria, ${location}</p>
            <p class="mb-0 small text-danger fw-semibold">${referrals} REFERRALS ${reports ? `<span class="text-danger">${reports} REPORT${reports > 1 ? "S" : ""}</span>` : ""}</p>
          </div>
        `;
                col.querySelector(".provider-card").addEventListener("click", () => {
                    showProviderModal({ name, phone, location, referrals });
                });
                providerGrid.appendChild(col);
            });
        }

        function showProviderModal({ name, phone, location, referrals }) {
            document.getElementById("modalName").innerText = name;
            document.getElementById("modalPhone").innerText = `AC Technician ${phone}`;
            document.getElementById("modalLocation").innerText = `Nigeria, ${location}`;
            document.getElementById("modalReferrals").innerText = `${referrals} REFERRALS`;

            new bootstrap.Modal(document.getElementById("providerModal")).show();
        }

        document.querySelectorAll(".nav-link").forEach(tab => {
            tab.addEventListener("click", e => {
                e.preventDefault();
                document.querySelectorAll(".nav-link").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                const key = tab.textContent.trim().toLowerCase().replace(" ", "");
                renderProviders(serviceProviders[key] || []);
            });
        });

        // Clear search
        searchInput.addEventListener("input", () => {
            clearBtn.style.display = searchInput.value ? "block" : "none";
        });

        clearBtn.addEventListener("click", () => {
            searchInput.value = "";
            clearBtn.style.display = "none";
            searchInput.focus();
        });

        // Initial render
        renderProviders(serviceProviders.all);
    </script>
</body>

</html>
