<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refer Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiko:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }

      .form-control {
    border-radius: 50px;
    padding-left: 20px;
    height: 47px;
    width: 100%; /* Take full width of column */
    max-width: 100%; /* No restriction */
    font-size: 1rem;
    background-color: white;
    box-shadow: 1px 8px 12px rgba(0, 0, 0, 0.06);
    border: none;
}



        .form-control:focus {
            border-color: #b80000;
            box-shadow: 0 0 0 0.2rem rgba(184, 0, 0, 0.25);
        }


        .form-label {
            font-size: 0.9rem;
            color: #d00;
        }

        .refer-btn {
            background-color: #b80000;
            color: #fff;
            border-radius: 40px;
            padding: 12px 60px;
            font-size: 1.2rem;
            margin-top: 30px;
        }

        .refer-btn:hover {
            background-color: #900;
        }



        .logo-box img {
            width: 40px;
        }

        .refer-heading {
            font-family: 'Amiko', sans-serif;
            font-weight: 700;
            /* Bold */
            font-size: 32px;
            line-height: 1;
            /* 100% */
            text-align: center;
            color: #b80000;
            letter-spacing: normal;
            /* or adjust if needed */
            margin: 0;
            /* optional: remove default h2 margin */
            padding-top: 40px;
        }

        .form-section {
            max-width: 900px;
            margin: auto;
            padding: 30px 15px;
        }

        .custom-text {
            font-family: 'Amiko', sans-serif;
            font-weight: 700;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            /* 100% */
            letter-spacing: 0;
            text-align: center;
            color: #333;
            /* You can customize the color */
            padding-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container text-center mt-5">
        <div class="pt-5">
            <!-- Replace with actual icon if available -->
            <img src="assets/images/search/search-1.png" alt="Handshake Icon" />
        </div>
        <h2 class="refer-heading">REFER</h2>
        <p class="custom-text">Referrals are best thing you can do for service providers who have rendered good services
            to you.
        </p>

    </div>

    <div class="form-section">
        <form>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">I am referring</label>
                    <input type="text" class="form-control" placeholder="Real / Nick Name">
                </div>
                <div class="col-md-4">
                    <label class="form-label d-block">&nbsp;</label>
                    <input type="text" class="form-control" placeholder="Service he/she renders">
                </div>
                <div class="col-md-4">
                    <label class="form-label d-block">&nbsp;</label>
                    <input type="text" class="form-control" placeholder="1 or 2 Mobile Nos.">
                </div>

                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Country">
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="City / Town">
                </div>




                <div class="col-md-4">
                    
                    <input type="text" class="form-control" placeholder="Reviews e.g Very reliable">
                </div>

                <div class="col-md-6 offset-md-3 text-center">
                    <label class="form-label">Referred By</label>
                    <input type="text" class="form-control" placeholder="Your Email and Mobile No.">
                </div>

                <div class="text-center">
                    <button type="submit" class="btn refer-btn">Refer</button>
                </div>


            </div>

        </form>
    </div>

</body>

</html>
