<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baton Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/search.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body>
    <div class="container-fluid">
        <!-- Top Row -->
        <div class="top-bar d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <img src="assets/images/vector/location-vector.png" alt="Location" width="24" height="24" />
                <!-- <span id="locationText" class="text-muted fw-semibold">Detecting location...</span> --><span
                    id="locationText" class="text-muted fw-semibold" style="cursor: pointer;">Getting location...</span>


            </div>
    <!-- Map Modal -->
    <div id="mapModal" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 d-none" style="z-index: 1050;">
        <div class="position-absolute top-50 start-50 translate-middle bg-white p-3 rounded"
            style="width: 90%; max-width: 500px;">
            <div id="map" style="height: 300px;"></div>
            <div class="text-end mt-2">
                <button class="btn btn-sm btn-success" onclick="confirmManualLocation()">Confirm</button>
                <button class="btn btn-sm btn-danger" onclick="closeMapModal()">Cancel</button>
            </div>
        </div>
    </div>



            <div>
                <div class="rounded-circle bg-warning text-white fw-bold d-flex justify-content-center align-items-center"
                    style="width: 40px; height: 40px;">
                    FA
                </div>
            </div>
        </div>

        <!-- Center Section: Logo and Search -->
        <div class="logo-and-search">
            <img src="assets/images/logo/baton-search.png" alt="Baton Logo" style="height: 40px;" class="mb-4" />

            <div class="search-bar">
                <img src="https://cdn-icons-png.flaticon.com/512/49/49116.png" alt="Search" width="24"
                    class="me-2 opacity-50" />
                <input type="text" class="form-control" placeholder="Search Service Providers" />
                <img src="assets/images/search/search-1.png" class="icon-btn" alt="Handshake" />
                <img src="assets/images/search/search-2.png" class="icon-btn" alt="Megaphone" />
                <img src="assets/images/search/search-3.png" class="icon-btn" alt="Settings" />
            </div>
        </div>

        <!-- Bottom Text -->
        <div class="bottom-text">
            <p class="text-uppercase fw-semibold text-secondary" style="letter-spacing: 2px;">Get Reliable</p>
            <h1 id="rotatingArtisan" class="fw-bold text-dark display-4">Carpenters</h1>
        </div>
    </div>

    <script src="assets/js/search.js"></script>
    <!-- Leaflet Map Dependencies -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</body>

<script>
    let map;
    let marker;

    document.getElementById('locationModal').addEventListener('shown.bs.modal', function () {
        if (!map) {
            map = L.map('map').setView([9.0765, 7.3986], 10); // default to Abuja

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
            }).addTo(map);

            marker = L.marker([9.0765, 7.3986], { draggable: true }).addTo(map);

            marker.on('dragend', async () => {
                const { lat, lng } = marker.getLatLng();
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
                const data = await response.json();
                const city = data.address.city || data.address.town || data.address.village || "Your Area";
                const country = data.address.country || "";
                locationText.textContent = `${city}, ${country}`;
            });
        }
    });
</script>

</html>
